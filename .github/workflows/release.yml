name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build CLI binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          targets="darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64"
          for target in $targets; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            output="dist/lore-${os}-${arch}${ext}"
            echo "Building ${output}..."
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.Version=${VERSION}" -o "$output" ./cmd
          done

      - name: Build VSCode extension
        working-directory: vscode-lore
        run: |
          npm install
          npm run bundle
          npx @vscode/vsce package -o ../dist/lore.vsix

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lore-*
            dist/lore.vsix
          generate_release_notes: true
