name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - run: go vet ./...

      - run: go test ./...

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-lore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci || npm install

      - run: npm run bundle
