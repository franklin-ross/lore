version: "3"

vars:
  BIN: bin/lore

tasks:
  default:
    desc: Build, format, lint, and test
    cmds:
      - task: format
      - task: lint
      - task: build
      - task: test

  build:
    desc: Build the CLI binary
    cmds:
      - go build -o {{.BIN}} ./cmd

  format:
    desc: Format all Go source files
    cmds:
      - gofmt -w .

  lint:
    desc: Run static analysis
    cmds:
      - golangci-lint run ./...

  test-unit:
    desc: Run unit tests
    cmds:
      - go test ./internal/...

  test-e2e:
    desc: Run end-to-end tests
    deps: [build]
    cmds:
      - go test -v ./e2e_test.go

  test:
    desc: Run all tests (unit + e2e)
    cmds:
      - go test ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BIN}}
