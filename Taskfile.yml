version: "3"

vars:
  BIN: bin/lore
  VSIX: bin/lore.vsix

tasks:
  default:
    desc: Build, format, lint, and test
    cmds:
      - task: format
      - task: lint
      - task: build
      - task: test

  build:
    desc: Build the CLI binary
    cmds:
      - go build -o {{.BIN}} ./cmd
    generates:
      - "{{.BIN}}"

  format:
    desc: Format all Go source files and tidy dependencies
    cmds:
      - go fmt
      - go mod tidy

  lint:
    desc: Run static analysis
    cmds:
      - golangci-lint run ./...

  test-unit:
    desc: Run unit tests
    cmds:
      - go test ./internal/...

  test-e2e:
    desc: Run end-to-end tests
    deps: [build]
    cmds:
      - go test -v ./e2e_test.go

  test:
    desc: Run all tests (unit + e2e)
    cmds:
      - go test ./...

  build-vscode:
    desc: Build the VSCode extension
    dir: vscode-lore
    cmds:
      - npm install
      - npm run bundle

  package-vscode:
    desc: Package the VSCode extension as .vsix into bin/
    dir: vscode-lore
    deps: [build-vscode]
    cmds:
      - npx @vscode/vsce package -o ../{{.VSIX}} --allow-missing-repository

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BIN}} {{.VSIX}}
      - rm -rf vscode-lore/out/ vscode-lore/node_modules/

  install:
    desc: Build and install the binary and VSCode extension
    deps: [build, package-vscode]
    cmds:
      - cp ./bin/lore ~/bin/lore
      - code --install-extension {{.VSIX}} --force