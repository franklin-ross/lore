version: "3"

vars:
  BIN: bin/lore
  INSTALLED_BIN: ~/bin/lore
  VSIX: bin/lore.vsix

env:
  GOCACHE: "{{.TASKFILE_DIR}}/.gocache/build"
  GOLANGCI_LINT_CACHE: "{{.TASKFILE_DIR}}/.gocache/lint"

tasks:
  default:
    desc: Build, format, lint, and test
    cmds:
      - task: format
      - task: lint
      - task: build
      - task: test

  build:
    desc: Build the CLI binary
    cmds:
      - go build -o {{.BIN}} ./cmd
    generates:
      - "{{.BIN}}"

  format:
    desc: Format all Go source files and tidy dependencies
    cmds:
      - go fmt
      - go mod tidy

  update-deps:
    desc: Update all Go and npm dependencies to latest (not major versions for npm)
    cmds:
      - go get -u ./...
      - go mod tidy
      - cd vscode-lore && npm update --save
      - cd vscode-lore && npm install

  lint:
    desc: Run static analysis
    cmds:
      - golangci-lint run ./...

  test-unit:
    desc: Run unit tests (extra args forwarded, e.g. `task test-unit -- -run TestFoo -v`)
    cmds:
      - go test {{.CLI_ARGS}} ./internal/...

  test-e2e:
    desc: Run end-to-end tests (extra args forwarded)
    deps: [build]
    cmds:
      - go test -v {{.CLI_ARGS}} ./e2e_test.go

  test:
    desc: Run all tests (unit + e2e; extra args forwarded)
    cmds:
      - go test {{.CLI_ARGS}} ./...

  build-vscode:
    desc: Build the VSCode extension
    dir: vscode-lore
    cmds:
      - npm install
      - npm run bundle

  package-vscode:
    desc: Package the VSCode extension as .vsix into bin/
    dir: vscode-lore
    deps: [build-vscode]
    cmds:
      - npx @vscode/vsce package -o ../{{.VSIX}}

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BIN}} {{.VSIX}}
      - rm -rf vscode-lore/out/ vscode-lore/node_modules/

  install:
    desc: Build and install the binary and VSCode extension
    deps: [build, package-vscode]
    cmds:
      - rm {{.INSTALLED_BIN}}
      - cp {{.BIN}} {{.INSTALLED_BIN}}
      - code --install-extension {{.VSIX}} --force

  version:
    desc: Print the current version (from vscode-lore/package.json)
    silent: true
    cmds:
      - 'printf "v%s\n" "$(cd vscode-lore && npm pkg get version | tr -d ''"'')"'

  release:
    desc: 'Cut a release: `task release -- patch|minor|major|prerelease|vX.Y.Z`. Lints, tests, builds, then bumps/commits/tags/pushes.'
    deps:
      - task: lint
      - task: test
        vars: { CLI_ARGS: "" }
      - task: build
      - task: build-vscode
    env:
      ARG: "{{.CLI_ARGS}}"
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: "Usage: task release -- <patch|minor|major|prerelease|vX.Y.Z>"
      - sh: '[ -z "$(git status --porcelain)" ]'
        msg: "Working tree must be clean before releasing"
    cmds:
      - |
        set -e
        case "$ARG" in
          major|minor|patch|premajor|preminor|prepatch|prerelease)
            NEW_VERSION=$(cd vscode-lore && npm version "$ARG" --no-git-tag-version --preid=rc)
            ;;
          v[0-9]*)
            if ! printf "%s" "$ARG" | grep -qE "^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$"; then
              echo "VERSION must be semver like v1.2.3 or v1.2.3-rc.1" >&2
              exit 1
            fi
            NEW_VERSION=$(cd vscode-lore && npm version "${ARG#v}" --no-git-tag-version --allow-same-version)
            ;;
          *)
            echo "Bad arg: $ARG. Use patch|minor|major|prerelease|vX.Y.Z" >&2
            exit 1
            ;;
        esac
        # npm version prints new version with `v` prefix.
        git fetch --tags --quiet
        if git rev-parse "$NEW_VERSION" >/dev/null 2>&1; then
          echo "Tag $NEW_VERSION already exists" >&2
          git checkout -- vscode-lore/package.json vscode-lore/package-lock.json
          exit 1
        fi
        git add vscode-lore/package.json vscode-lore/package-lock.json
        git commit -m "release: $NEW_VERSION"
        git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
        git push origin HEAD "$NEW_VERSION"
        echo "Released $NEW_VERSION"